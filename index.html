<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="theme-color" content="#0f1320">
<title>Pokémon TCG Tracker</title>
<style>
  :root{
    --bg:#0f1320;--surface:#171c2e;--card:#1c2336;--card2:#222b42;
    --border:#2b3450;--border2:#3a456a;--primary:#ef4444;--indigo:#6366f1;
    --gold:#f0b429;--text:#e8eaf2;--muted:#8b93a8;--faint:#5b647d;--green:#4ade80;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
  #root{max-width:1180px;margin:0 auto}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
  input,textarea,button{font-family:inherit}
  input::placeholder,textarea::placeholder{color:var(--faint)}
  a{color:inherit}
  button{touch-action:manipulation}

  .header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:50;flex-wrap:wrap}
  .htitle{font-size:17px;font-weight:700;letter-spacing:-.3px}
  .hsub{font-size:12px;color:var(--muted);margin-top:1px}
  .backbtn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;padding:0 4px}
  .pill{border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;background:var(--card);color:var(--text);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .pill:hover{background:var(--card2)}
  .pill.primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .syncdot{width:7px;height:7px;border-radius:50%;display:inline-block}

  .body{padding:14px 16px 40px}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
  .stats.four{grid-template-columns:repeat(4,1fr)}
  .stat{background:var(--surface);border-radius:10px;padding:11px 13px}
  .stat .l{font-size:11px;color:var(--muted);margin-bottom:4px}
  .stat .v{font-size:18px;font-weight:700}
  .search{width:100%;padding:10px 13px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;outline:none}
  .search:focus{border-color:var(--border2)}
  .hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .hscroll::-webkit-scrollbar{display:none}
  .chip{border:1px solid var(--border);border-radius:99px;padding:5px 13px;font-size:12px;cursor:pointer;background:var(--card);color:var(--muted);white-space:nowrap;flex-shrink:0}
  .chip.on{background:var(--indigo);border-color:var(--indigo);color:#fff}

  .setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:11px}
  .setcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .1s}
  .setcard:hover{border-color:var(--border2);transform:translateY(-2px)}
  .setcard.done{border-color:var(--green)}
  .setlogo-wrap{height:44px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .setlogo{max-width:100%;max-height:44px;width:auto;height:auto;object-fit:contain;display:block}
  .setname{font-size:12px;font-weight:600;text-align:center;line-height:1.3}
  .setseries{font-size:10px;color:var(--faint);text-align:center}
  .setval{font-size:11px;color:var(--gold);text-align:center;font-weight:600}

  .pbar{flex:1;height:5px;background:var(--border);border-radius:99px;overflow:hidden}
  .pbar>div{height:100%;border-radius:99px;transition:width .4s ease}
  .pbtxt{font-size:11px;color:var(--muted);min-width:46px;text-align:right}

  .fbtn{border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;background:var(--card);color:var(--muted);white-space:nowrap}
  .fbtn.fall{border-color:var(--border2);color:var(--text)}
  .fbtn.fhave{background:rgba(74,222,128,.13);border-color:var(--green);color:var(--green)}
  .fbtn.fmiss{background:rgba(239,68,68,.13);border-color:var(--primary);color:#fca5a5}
  .sbtn{border:1px solid var(--border);border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;background:var(--card);color:var(--muted);white-space:nowrap;flex-shrink:0}
  .sbtn.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .szbtns{display:flex;gap:3px;flex-shrink:0}
  .szbtn{border:1px solid var(--border);border-radius:6px;padding:5px 9px;font-size:11px;cursor:pointer;background:var(--card);color:var(--muted)}
  .szbtn.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .abtn{border:1px solid var(--border);border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;background:transparent;color:var(--muted);white-space:nowrap}
  .abtn:hover{background:var(--card2)}
  .expbtn{border:1px solid var(--border2);border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;background:rgba(99,102,241,.15);color:#a5b4fc;white-space:nowrap}
  .expbtn:hover{background:rgba(99,102,241,.25)}

  .cardgrid{display:grid;gap:9px}
  .ctile{position:relative;cursor:pointer;border-radius:7px;border:2px solid var(--border);overflow:hidden;background:var(--card);transition:border-color .15s,transform .1s}
  .ctile:hover{border-color:var(--border2);transform:translateY(-2px)}
  .ctile.owned{border-color:var(--gold)}
  .ctile:not(.owned) img{opacity:.55}
  .ctile img{width:100%;display:block}
  .qbadge{position:absolute;top:4px;right:4px;border-radius:5px;padding:2px 6px;font-size:9px;font-weight:700;cursor:pointer;z-index:2;line-height:1.4}
  .cbot{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.88) 50%);padding:12px 5px 4px;display:flex;justify-content:space-between;align-items:flex-end;gap:2px}
  .cnum{font-size:9px;color:#94a3b8;line-height:1;flex-shrink:0;white-space:nowrap}
  .cprice{font-size:9px;font-weight:700;line-height:1;text-align:right;flex-shrink:0;white-space:nowrap}
  .cprice a{color:#fcd34d;text-decoration:none}

  /* MODAL DE EXPORTAÇÃO */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:20px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
  .modal-title{font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .modal-close{background:none;border:none;cursor:pointer;color:var(--muted);font-size:22px;line-height:1}
  .opt-group{display:flex;flex-direction:column;gap:6px}
  .opt-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .opt-row{display:flex;gap:6px;flex-wrap:wrap}
  .opt-btn{border:1px solid var(--border);border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;background:var(--card);color:var(--muted);white-space:nowrap}
  .opt-btn.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .export-out{width:100%;min-height:140px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-family:monospace;padding:10px;resize:vertical;outline:none}
  .copy-btn{background:var(--indigo);border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:600;padding:10px 20px;cursor:pointer;width:100%}
  .copy-btn:hover{filter:brightness(1.1)}
  .copied{background:var(--green);color:#000}

  .empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:14px}
  .spin{display:inline-block;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .note{font-size:11px;color:var(--faint);margin-bottom:12px;line-height:1.5}
  .banner{background:rgba(99,102,241,.12);border:1px solid var(--border2);border-radius:10px;padding:11px 14px;font-size:13px;color:#c7d2fe;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;line-height:1.5}

  @media(max-width:600px){
    .stats{grid-template-columns:repeat(2,1fr);gap:6px}
    .stats.four{grid-template-columns:repeat(2,1fr)}
    .stat{padding:9px 9px}.stat .v{font-size:16px}.stat .l{font-size:10px}
    .htitle{font-size:15px}
    .cardgrid{gap:7px}
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDqpo3TmSt1WcFQtIO9nr31Vea8nJswmCc",
  authDomain: "tcg-tracker-8f256.firebaseapp.com",
  projectId: "tcg-tracker-8f256",
  storageBucket: "tcg-tracker-8f256.firebasestorage.app",
  messagingSenderId: "79092502365",
  appId: "1:79092502365:web:4fa9df6fde0faac6e7e2b4"
};
const POKEMON_API_KEY = "";
const API  = "https://api.pokemontcg.io/v2";
const TCGD = "https://api.tcgdex.net/v2/pt";
const apiOpts = POKEMON_API_KEY ? {headers:{"X-Api-Key":POKEMON_API_KEY}} : {};

const Q = ["NM","LP","MP","HP","DMG"];
const QBG = {NM:"rgba(74,222,128,.9)",LP:"rgba(132,204,22,.9)",MP:"rgba(240,180,41,.9)",HP:"rgba(248,113,113,.9)",DMG:"rgba(185,28,28,.95)"};
const QFG = {NM:"#0a2e12",LP:"#1a2e05",MP:"#3d2a02",HP:"#3d0808",DMG:"#fee"};
const QLabel = {NM:"Near Mint",LP:"Lightly Played",MP:"Moderately Played",HP:"Heavily Played",DMG:"Danificada"};
const RRANK = {"Common":1,"Uncommon":2,"Rare":3,"Rare Holo":4,"Double Rare":5,"Rare Holo EX":5,"Rare Holo GX":5,"Rare Holo V":5,"Rare Holo VMAX":6,"Rare Holo VSTAR":6,"Ultra Rare":7,"Rare Ultra":7,"Trainer Gallery Rare Holo":7,"Illustration Rare":8,"Rare Rainbow":8,"Shiny Rare":8,"Amazing Rare":8,"Special Illustration Rare":9,"Shiny Ultra Rare":9,"ACE SPEC Rare":9,"Hyper Rare":10,"Secret Rare":10,"Crown Rare":11};
const SORTS = [{id:"num",label:"Nº"},{id:"name",label:"Nome"},{id:"price-d",label:"Preço ↓"},{id:"price-a",label:"Preço ↑"},{id:"rarity",label:"Raridade"},{id:"status",label:"Status"}];
const SIZES = [{id:"xs",label:"S",min:72},{id:"sm",label:"M",min:108},{id:"lg",label:"L",min:148},{id:"xl",label:"XL",min:190}];

let FB_OK=false,auth=null,db=null;
try{
  if(FIREBASE_CONFIG.apiKey&&!FIREBASE_CONFIG.apiKey.includes("SUA_")){
    firebase.initializeApp(FIREBASE_CONFIG);
    auth=firebase.auth(); db=firebase.firestore();
    try{db.enablePersistence({synchronizeTabs:true})}catch(e){}
    FB_OK=true;
  }
}catch(e){console.warn("Firebase:",e.message)}

const LS_KEY="ptcg_cols",LS_VALS="ptcg_vals";
const lsGetAll=()=>{try{return JSON.parse(localStorage.getItem(LS_KEY))||{}}catch{return{}}};
const lsSetAll=c=>{try{localStorage.setItem(LS_KEY,JSON.stringify(c))}catch{}};
const lsGetVals=()=>{try{return JSON.parse(localStorage.getItem(LS_VALS))||{}}catch{return{}}};
const lsSetVals=v=>{try{localStorage.setItem(LS_VALS,JSON.stringify(v))}catch{}};

function price(card){
  const p=card.tcgplayer&&card.tcgplayer.prices;
  if(!p)return null;
  const vs=['holofoil','normal','reverseHolofoil','1stEditionHolofoil','1stEditionNormal',
            'unlimitedHolofoil','unlimited','doubleRare','ultraRare','illustrationRare',
            'specialIllustrationRare','hyperRare','shinyRare','shinyUltraRare'];
  for(const v of vs){if(p[v]){const x=p[v].market||p[v].mid||p[v].low;if(x)return x;}}
  return null;
}
function fmtBRL(usd,rate){
  if(!usd||!rate)return null;
  return "R$\u00a0"+(usd*rate).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function ligaCardUrl(card,set){
  const numInt=parseInt(card.number);
  const num=!isNaN(numInt)?String(numInt).padStart(3,'0'):card.number;
  const total=String(set.printedTotal||set.total||0).padStart(3,'0');
  const ed=encodeURIComponent(set.ptcgoCode||'');
  return 'https://www.ligapokemon.com.br/?view=cards/card&card='+card.name.replace(/ /g,'+')+
         '%20('+num+'/'+total+')&ed='+ed+'&num='+num;
}
function sortCards(cards,by,owned){
  const s=[...cards];
  if(by==="name")return s.sort((a,b)=>a.name.localeCompare(b.name));
  if(by==="price-d")return s.sort((a,b)=>(price(b)||0)-(price(a)||0));
  if(by==="price-a")return s.sort((a,b)=>(price(a)||0)-(price(b)||0));
  if(by==="rarity")return s.sort((a,b)=>(RRANK[b.rarity]||0)-(RRANK[a.rarity]||0));
  if(by==="status")return s.sort((a,b)=>{const ao=owned[a.id]?1:0,bo=owned[b.id]?1:0;if(bo!==ao)return bo-ao;return(parseInt(a.number)||0)-(parseInt(b.number)||0)});
  return s.sort((a,b)=>{const an=parseInt(a.number)||0,bn=parseInt(b.number)||0;return an!==bn?an-bn:a.number.localeCompare(b.number,undefined,{numeric:true})});
}

const {useState,useEffect,useRef}=React;
const h=(t,p,...c)=>React.createElement(t,p,...c);
const div=(p,...c)=>h("div",p,...c);

function Pbar({owned,total}){
  const pct=total>0?Math.round(owned/total*100):0;
  const bg=pct===100?"var(--green)":pct>0?"var(--indigo)":"var(--border2)";
  return div({style:{display:"flex",alignItems:"center",gap:7,flex:1}},
    div({className:"pbar"},div({style:{width:pct+"%",background:bg}})),
    h("span",{className:"pbtxt"},owned+"/"+total)
  );
}

/* ---------- MODAL DE EXPORTAÇÃO ---------- */
function ExportModal({cards,owned,set,ptCardNames,rate,onClose}){
  const [ef,setEf]=useState("have");    // have | all | missing
  const [eg,setEg]=useState("num");     // num | rarity | name
  const [fmt,setFmt]=useState("liga");  // liga | csv | simple
  const [copied,setCopied]=useState(false);

  function buildList(){
    let subset=cards.filter(c=>{
      if(ef==="have")return !!owned[c.id];
      if(ef==="missing")return !owned[c.id];
      return true;
    });
    // sort/group
    if(eg==="rarity") subset=subset.sort((a,b)=>(RRANK[b.rarity]||0)-(RRANK[a.rarity]||0)||(parseInt(a.number)||0)-(parseInt(b.number)||0));
    else if(eg==="name") subset=subset.sort((a,b)=>a.name.localeCompare(b.name));
    else subset=subset.sort((a,b)=>(parseInt(a.number)||0)-(parseInt(b.number)||0));

    const ed=set.ptcgoCode||'';
    const total=String(set.printedTotal||set.total||0).padStart(3,'0');

    if(fmt==="csv"){
      const rows=["Qtd,Nome PT,Nome EN,Número,Coleção,Raridade,Qualidade,Preço BRL"];
      subset.forEach(c=>{
        const num=String(parseInt(c.number)||0).padStart(3,'0');
        const ptName=ptCardNames[c.number]||'';
        const q=owned[c.id]||'';
        const brl=rate&&price(c)?(price(c)*rate).toFixed(2):'';
        rows.push([1,ptName,c.name,num+'/'+total,ed,c.rarity||'',q,brl].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
      });
      return rows.join('\n');
    }
    if(fmt==="simple"){
      return subset.map(c=>{
        const ptName=ptCardNames[c.number]||c.name;
        return ptName;
      }).join('\n');
    }
    // liga: formato "Compra por Lista" / referência
    if(eg==="rarity"){
      const groups={};
      subset.forEach(c=>{const r=c.rarity||'Sem raridade';if(!groups[r])groups[r]=[];groups[r].push(c);});
      const lines=[];
      Object.entries(groups).sort((a,b)=>(RRANK[b[0]]||0)-(RRANK[a[0]]||0)).forEach(([r,cs])=>{
        lines.push('## '+r);
        cs.forEach(c=>{
          const num=String(parseInt(c.number)||0).padStart(3,'0');
          const ptName=ptCardNames[c.number]||c.name;
          const q=owned[c.id]?` [${owned[c.id]}]`:'';
          lines.push('1 '+ptName+' ('+num+'/'+total+') '+ed+q);
        });
        lines.push('');
      });
      return lines.join('\n').trim();
    }
    return subset.map(c=>{
      const num=String(parseInt(c.number)||0).padStart(3,'0');
      const ptName=ptCardNames[c.number]||c.name;
      const q=owned[c.id]?` [${owned[c.id]}]`:'';
      return '1 '+ptName+' ('+num+'/'+total+') '+ed+q;
    }).join('\n');
  }

  const text=buildList();
  const copy=()=>{
    navigator.clipboard.writeText(text).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000)});
  };

  const optBtn=(cur,val,label,setter)=>
    h("button",{className:"opt-btn"+(cur===val?" on":""),onClick:()=>setter(val)},label);

  return div({className:"overlay",onClick:e=>{if(e.target.className==="overlay")onClose()}},
    div({className:"modal"},
      div({className:"modal-title"},
        "Exportar Lista",
        h("button",{className:"modal-close",onClick:onClose},"×")
      ),
      div({className:"opt-group"},
        div({className:"opt-label"},"Cartas"),
        div({className:"opt-row"},
          optBtn(ef,"have","✓ Tenho ("+Object.keys(owned).length+")",setEf),
          optBtn(ef,"missing","✗ Faltam ("+(cards.length-Object.keys(owned).length)+")",setEf),
          optBtn(ef,"all","Todas ("+cards.length+")",setEf)
        )
      ),
      div({className:"opt-group"},
        div({className:"opt-label"},"Agrupar por"),
        div({className:"opt-row"},
          optBtn(eg,"num","Número",setEg),
          optBtn(eg,"rarity","Raridade",setEg),
          optBtn(eg,"name","Nome",setEg)
        )
      ),
      div({className:"opt-group"},
        div({className:"opt-label"},"Formato"),
        div({className:"opt-row"},
          optBtn(fmt,"liga","Liga Pokémon",setFmt),
          optBtn(fmt,"simple","Só nomes",setFmt),
          optBtn(fmt,"csv","CSV completo",setFmt)
        )
      ),
      div({style:{fontSize:11,color:"var(--faint)",lineHeight:1.5}},
        fmt==="liga"
          ? "Formato: 1 Nome (Nº/Total) CÓDIGO [Qualidade] — copie e cole no campo de lista da Liga Pokémon."
          : fmt==="csv"
          ? "CSV com todas as colunas — abra no Excel ou Google Sheets."
          : "Um nome por linha — útil para buscas rápidas."
      ),
      h("textarea",{className:"export-out",readOnly:true,value:text,rows:10}),
      h("button",{className:"copy-btn"+(copied?" copied":""),onClick:copy},
        copied?"✓ Copiado!":"Copiar lista"
      )
    )
  );
}

/* ---------- APP PRINCIPAL ---------- */
function App(){
  const [view,setView]=useState("sets");
  const [sets,setSets]=useState([]);
  const [sel,setSel]=useState(null);
  const [cards,setCards]=useState([]);
  const [allCols,setAllCols]=useState({});
  const [valsCached,setValsCached]=useState(()=>lsGetVals());
  const [filter,setFilter]=useState("all");
  const [cq,setCq]=useState("");
  const [sq,setSq]=useState("");
  const [loading,setLoading]=useState(true);
  const [cLoading,setCLoading]=useState(false);
  const [seriesF,setSeriesF]=useState("all");
  const [sortBy,setSortBy]=useState("num");
  const [cardSize,setCardSize]=useState("sm");
  const [rate,setRate]=useState(null);
  const [err,setErr]=useState(null);
  const [user,setUser]=useState(null);
  const [authReady,setAuthReady]=useState(!FB_OK);
  const [sync,setSync]=useState("idle");
  const [showExport,setShowExport]=useState(false);
  /* Nomes em Português (TCGdex pt-BR) */
  const [ptSetNames,setPtSetNames]=useState({});
  const [ptCardNames,setPtCardNames]=useState({});
  /* Busca global de cartas */
  const [searchMode,setSearchMode]=useState("sets"); // "sets" | "cards"
  const [cardResults,setCardResults]=useState([]);
  const [cardSearchLoading,setCardSearchLoading]=useState(false);
  const [cardSearchDone,setCardSearchDone]=useState(false);

  const userRef=useRef(null);
  const saveTimer=useRef(null);
  const cardSearchTimer=useRef(null);
  useEffect(()=>{userRef.current=user},[user]);

  /* boot */
  useEffect(()=>{
    setAllCols(lsGetAll());
    fetch("https://api.exchangerate-api.com/v4/latest/USD").then(r=>r.json()).then(d=>setRate(d.rates.BRL)).catch(()=>setRate(5.40));
    /* nomes PT dos sets */
    fetch(TCGD+"/sets").then(r=>r.json()).then(data=>{
      const m={};
      if(Array.isArray(data))data.forEach(s=>{if(s.id&&s.name)m[s.id]=s.name;});
      setPtSetNames(m);
    }).catch(()=>{});
  },[]);

  /* sets da API principal */
  useEffect(()=>{
    (async()=>{
      try{
        const r=await fetch(API+"/sets?orderBy=-releaseDate&pageSize=250",apiOpts);
        if(!r.ok)throw new Error();
        const{data}=await r.json();
        setSets(data);
      }catch{setErr("Não consegui carregar as coleções. Recarregue a página.")}
      setLoading(false);
    })();
  },[]);

  /* busca global de cartas (debounce 500ms) */
  useEffect(()=>{
    if(searchMode!=="cards"){return;}
    if(!sq||sq.trim().length<2){setCardResults([]);setCardSearchDone(false);return;}
    setCardSearchLoading(true);setCardSearchDone(false);
    clearTimeout(cardSearchTimer.current);
    cardSearchTimer.current=setTimeout(async()=>{
      try{
        const q=sq.trim();
        /* formato NNN/YYY → busca por número */
        const numMatch=q.match(/^(\d{1,4})\/(\d{1,4})$/);
        let apiQ;
        if(numMatch){
          apiQ='number:'+parseInt(numMatch[1]);
        }else{
          /* nome: suporte a busca parcial */
          const safe=q.replace(/[":]/g,'');
          apiQ='name:"*'+safe+'*"';
        }
        const r=await fetch(API+'/cards?q='+encodeURIComponent(apiQ)+'&pageSize=30&orderBy=-set.releaseDate',apiOpts);
        const{data}=await r.json();
        setCardResults(data||[]);
      }catch{setCardResults([]);}
      setCardSearchLoading(false);setCardSearchDone(true);
    },500);
  },[sq,searchMode]);

  /* recalcula valor quando cartas/owned mudam */
  useEffect(()=>{
    if(!sel||cards.length===0)return;
    const ow=allCols[sel.id]||{};
    const val=cards.reduce((s,c)=>ow[c.id]?s+(price(c)||0):s,0);
    setValsCached(prev=>{const next={...prev,[sel.id]:val};lsSetVals(next);return next;});
  },[cards,allCols,sel]);

  /* auth + sync firebase */
  useEffect(()=>{
    if(!FB_OK)return;
    const unsub=auth.onAuthStateChanged(async u=>{
      setUser(u);setAuthReady(true);
      if(u){
        setSync("loading");
        try{
          const snap=await db.collection("users").doc(u.uid).get();
          const local=lsGetAll();
          if(snap.exists&&snap.data().cols){
            const cloud=snap.data().cols;
            setAllCols(cloud);lsSetAll(cloud);setSync("saved");
          }else if(Object.keys(local).length){
            await db.collection("users").doc(u.uid).set({cols:local,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
            setAllCols(local);setSync("saved");
          }else{setAllCols({});setSync("saved");}
        }catch{setSync("error");setAllCols(lsGetAll());}
      }else{setAllCols(lsGetAll());setSync("idle");}
    });
    return()=>unsub();
  },[]);

  const persist=cols=>{
    lsSetAll(cols);
    const u=userRef.current;
    if(FB_OK&&u){
      setSync("saving");clearTimeout(saveTimer.current);
      saveTimer.current=setTimeout(()=>{
        db.collection("users").doc(u.uid).set({cols,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})
          .then(()=>setSync("saved")).catch(()=>setSync("error"));
      },700);
    }
  };

  const login=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){alert("Erro: "+e.message)}};
  const logout=()=>auth.signOut();

  const openSet=async set=>{
    setSel(set);setView("cards");setCLoading(true);
    setFilter("all");setCq("");setSortBy("num");setPtCardNames({});
    window.scrollTo(0,0);
    try{
      const r=await fetch(API+"/cards?q=set.id:"+set.id+"&orderBy=number&pageSize=250",apiOpts);
      const{data}=await r.json();
      setCards(data);
    }catch{setCards([]);}
    /* tenta carregar nomes PT do TCGdex em paralelo */
    try{
      const pr=await fetch(TCGD+"/sets/"+set.id);
      if(pr.ok){
        const pd=await pr.json();
        const m={};
        (pd.cards||[]).forEach(c=>{if(c.localId&&c.name)m[String(c.localId)]=c.name;});
        setPtCardNames(m);
      }
    }catch{}
    setCLoading(false);
  };

  const goBack=()=>{setView("sets");setSel(null);setCards([]);window.scrollTo(0,0);};
  const owned=sel?(allCols[sel.id]||{}):{};

  const toggleCard=id=>{
    setAllCols(prev=>{
      const sc={...(prev[sel.id]||{})};
      if(sc[id])delete sc[id];else sc[id]="NM";
      const next={...prev,[sel.id]:sc};persist(next);return next;
    });
  };
  const cycleQ=(e,id)=>{
    e.stopPropagation();
    setAllCols(prev=>{
      const sc={...(prev[sel.id]||{})};
      const i=Q.indexOf(sc[id]);
      if(i>=Q.length-1)delete sc[id];else sc[id]=Q[i+1];
      const next={...prev,[sel.id]:sc};persist(next);return next;
    });
  };
  const markAll=()=>{setAllCols(prev=>{const next={...prev,[sel.id]:Object.fromEntries(cards.map(c=>[c.id,"NM"]))};persist(next);return next;});};
  const clearAll=()=>{setAllCols(prev=>{const next={...prev,[sel.id]:{}};persist(next);return next;});};

  const seriesList=["all",...new Set(sets.map(s=>s.series))];
  const vSets=sets.filter(s=>{
    const q=sq.toLowerCase().trim();
    const n=(ptSetNames[s.id]||s.name).toLowerCase();
    return(!q||n.includes(q)||s.name.toLowerCase().includes(q)||s.series.toLowerCase().includes(q)||(s.ptcgoCode&&s.ptcgoCode.toLowerCase().includes(q)))
      &&(seriesF==="all"||s.series===seriesF);
  });
  const vCards=sortCards(cards.filter(c=>{
    const q=cq.toLowerCase();
    const ptN=(ptCardNames[c.number]||"").toLowerCase();
    const mQ=!q||c.name.toLowerCase().includes(q)||ptN.includes(q)||c.number.includes(q);
    const mF=filter==="all"||(filter==="have"&&owned[c.id])||(filter==="missing"&&!owned[c.id]);
    return mQ&&mF;
  }),sortBy,owned);

  const progFor=s=>({owned:Object.keys(allCols[s.id]||{}).length,total:s.printedTotal||s.total});
  const totalOwned=Object.values(allCols).reduce((a,c)=>a+Object.keys(c).length,0);
  const complete=sets.filter(s=>{const p=progFor(s);return p.total>0&&p.owned>=p.total;}).length;
  const curP=sel?progFor(sel):null;
  const colValue=cards.reduce((s,c)=>owned[c.id]?s+(price(c)||0):s,0);
  const totalValueUSD=Object.values(valsCached).reduce((a,v)=>a+v,0);

  const syncInfo=()=>{
    if(!FB_OK||!user)return null;
    const map={loading:["#f0b429","Carregando..."],saving:["#f0b429","Salvando..."],saved:["#4ade80","Sincronizado"],error:["#ef4444","Erro"],idle:["#5b647d",""]};
    const[col,txt]=map[sync]||map.idle;
    return div({style:{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"var(--muted)"}},
      h("span",{className:"syncdot",style:{background:col}}),txt
    );
  };

  if(loading)return div({style:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"70vh",gap:14,color:"var(--muted)"}},
    h("span",{className:"spin",style:{fontSize:26}},"◌"),"Carregando coleções Pokémon TCG..."
  );
  if(err)return div({style:{padding:50,textAlign:"center",color:"#fca5a5"}},err);

  return div(null,
    /* modal de exportação */
    showExport&&h(ExportModal,{cards,owned,set:sel,ptCardNames,rate,onClose:()=>setShowExport(false)}),

    /* HEADER */
    div({className:"header"},
      view==="cards"&&h("button",{className:"backbtn",onClick:goBack},"←"),
      div({style:{flex:1,minWidth:140}},
        div({className:"htitle"},view==="sets"?"Pokémon TCG Tracker":((sel&&(ptSetNames[sel.id]||sel.name))||"")),
        div({className:"hsub"},view==="sets"
          ?(totalOwned.toLocaleString("pt-BR")+" cartas · "+complete+" completas")
          :((sel&&sel.series||"")+" · "+(sel&&sel.ptcgoCode||"")+" · "+(sel&&sel.releaseDate||""))
        )
      ),
      syncInfo(),
      view==="cards"&&div({style:{display:"flex",gap:6,flexWrap:"wrap"}},
        h("button",{className:"expbtn",onClick:()=>setShowExport(true)},"↗ Exportar"),
        h("button",{className:"abtn",onClick:markAll},"✓ Todas"),
        h("button",{className:"abtn",onClick:clearAll},"Limpar")
      ),
      FB_OK&&authReady&&(user
        ?h("button",{className:"pill",onClick:logout,title:user.email||""},(user.displayName||"Sair").split(" ")[0]+" · Sair")
        :h("button",{className:"pill primary",onClick:login},"Entrar com Google")
      )
    ),

    div({className:"body"},
      view==="sets"&&!FB_OK&&div({className:"banner"},"⚠️ Sincronização desligada — preencha o FIREBASE_CONFIG no arquivo."),
      view==="sets"&&FB_OK&&!user&&div({className:"banner"},
        "Entre com sua conta Google para sincronizar entre PC e celular.",
        h("button",{className:"pill primary",onClick:login,style:{marginLeft:"auto"}},"Entrar")
      ),

      /* SETS VIEW */
      view==="sets"&&div(null,
        div({className:"stats four"},
          ...[
            ["Cartas coletadas",totalOwned.toLocaleString("pt-BR")],
            ["Coleções completas",complete],
            ["Coleções disponíveis",sets.length],
            ["Valor da coleção",totalValueUSD>0&&rate?fmtBRL(totalValueUSD,rate):"—"]
          ].map(([l,v],i)=>div({key:i,className:"stat"},
            div({className:"l"},l),
            div({className:"v",style:i===3?{color:"var(--gold)",fontSize:16}:{}},v)
          ))
        ),

        /* barra de busca + modo */
        h("input",{className:"search",value:sq,
          onChange:e=>{setSq(e.target.value);},
          placeholder:searchMode==="sets"
            ?"Buscar coleção por nome, série ou abreviação (ex: MEG, SVI)..."
            :"Buscar carta por nome (ex: Charizard) ou número (ex: 025/100)...",
          style:{marginBottom:8}}),
        div({style:{display:"flex",gap:6,marginBottom:14}},
          h("button",{
            className:"chip"+(searchMode==="sets"?" on":""),
            onClick:()=>{setSearchMode("sets");setCardResults([]);setCardSearchDone(false);}
          },"🗂 Coleções"),
          h("button",{
            className:"chip"+(searchMode==="cards"?" on":""),
            onClick:()=>{setSearchMode("cards");}
          },"🔍 Pokémon / Cartas")
        ),

        /* MODO COLEÇÕES */
        searchMode==="sets"&&div(null,
          div({className:"hscroll",style:{marginBottom:14}},
            ...seriesList.map(s=>h("button",{key:s,className:"chip"+(seriesF===s?" on":""),onClick:()=>setSeriesF(s)},s==="all"?"Todas":s))
          ),
          vSets.length===0
            ?div({className:"empty"},"Nenhuma coleção encontrada.")
            :div({className:"setgrid"},
              ...vSets.map(set=>{
                const p=progFor(set);const pct=p.total?Math.round(p.owned/p.total*100):0;
                const val=valsCached[set.id];
                const ptName=ptSetNames[set.id];
                return div({key:set.id,className:"setcard"+(pct===100?" done":""),onClick:()=>openSet(set)},
                  div({className:"setlogo-wrap"},
                    set.images&&set.images.logo
                      ?h("img",{className:"setlogo",src:set.images.logo,alt:set.name})
                      :div({style:{fontSize:10,color:"var(--muted)",textAlign:"center"}},ptName||set.name)
                  ),
                  div({className:"setname"},ptName||set.name),
                  div({className:"setseries"},(set.ptcgoCode?set.ptcgoCode+" · ":"")+set.series),
                  val&&val>0&&rate?div({className:"setval"},fmtBRL(val,rate)):null,
                  div({style:{display:"flex"}},h(Pbar,{owned:p.owned,total:p.total}))
                );
              })
            )
        ),

        /* MODO CARTAS */
        searchMode==="cards"&&div(null,
          cardSearchLoading&&div({className:"empty"},
            h("span",{className:"spin",style:{fontSize:20,display:"block",marginBottom:8}},"◌"),
            "Buscando cartas..."
          ),
          !cardSearchLoading&&cardSearchDone&&cardResults.length===0&&div({className:"empty"},"Nenhuma carta encontrada."),
          !cardSearchLoading&&cardResults.length>0&&div(null,
            div({style:{fontSize:12,color:"var(--muted)",marginBottom:10}},
              cardResults.length+" resultado"+(cardResults.length>1?"s":"")+" — clique para abrir a coleção"
            ),
            div({style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:10}},
              ...cardResults.map(card=>{
                const setData=sets.find(s=>s.id===card.set.id)||card.set;
                const ptName=ptSetNames[card.set.id];
                const numInt=parseInt(card.number);
                const num=!isNaN(numInt)?String(numInt).padStart(3,'0'):card.number;
                const total=String(card.set.printedTotal||card.set.total||0).padStart(3,'0');
                const ownedInSet=Object.keys(allCols[card.set.id]||{}).length;
                const totalInSet=card.set.printedTotal||card.set.total||0;
                return div({
                  key:card.id,
                  style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,
                         cursor:"pointer",overflow:"hidden",transition:"transform .1s,border-color .15s"},
                  onClick:()=>openSet(setData),
                  onMouseEnter:e=>e.currentTarget.style.transform="translateY(-2px)",
                  onMouseLeave:e=>e.currentTarget.style.transform=""
                },
                  card.images&&card.images.small
                    ?h("img",{src:card.images.small,alt:card.name,loading:"lazy",style:{width:"100%",display:"block"}})
                    :div({style:{aspectRatio:"2.5/3.5",background:"var(--card)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"var(--faint)",padding:4,textAlign:"center"}},card.name),
                  div({style:{padding:"6px 8px 8px"}},
                    div({style:{fontSize:11,fontWeight:600,color:"var(--text)",lineHeight:1.3,marginBottom:3}},card.name),
                    div({style:{display:"flex",alignItems:"center",gap:5,marginBottom:3}},
                      card.set.images&&card.set.images.symbol&&h("img",{src:card.set.images.symbol,style:{height:12,objectFit:"contain"}}),
                      h("span",{style:{fontSize:10,color:"var(--muted)"}},(ptName||card.set.name))
                    ),
                    div({style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
                      h("span",{style:{fontSize:10,color:"var(--faint)"}},"#"+num+"/"+total),
                      totalInSet>0&&h("span",{style:{fontSize:10,color:ownedInSet>0?"var(--green)":"var(--faint)"}},
                        ownedInSet+"/"+totalInSet
                      )
                    )
                  )
                );
              })
            )
          ),
          !cardSearchLoading&&!cardSearchDone&&!sq&&div({className:"empty",style:{paddingTop:32}},
            div({style:{fontSize:32,marginBottom:12}},"🔍"),
            "Digite o nome de um Pokémon ou o número no formato",
            h("br",null),
            h("code",{style:{background:"var(--card)",padding:"2px 8px",borderRadius:4,fontSize:13,marginTop:6,display:"inline-block"}},"025/100")
          )
        )
      ),

      /* CARDS VIEW */
      view==="cards"&&sel&&div(null,
        div({style:{display:"flex",alignItems:"center",gap:14,marginBottom:8,flexWrap:"wrap"}},
          div({style:{display:"flex",flex:1,minWidth:180}},h(Pbar,{owned:curP.owned,total:curP.total})),
          rate&&colValue>0&&div({style:{fontSize:13,color:"var(--gold)",fontWeight:600,whiteSpace:"nowrap"}},"Valor: "+fmtBRL(colValue,rate))
        ),
        div({className:"note"},
          "Preços: TCGPlayer (USD → BRL a "+(rate?rate.toFixed(2):"...") +"). Toque no preço para ver na Liga Pokémon. "+
          (Object.keys(ptCardNames).length>0?"Nomes em Português (TCGdex).":"")
        ),
        div({style:{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap",alignItems:"center"}},
          ...[["all","Todas","fall"],["have","✓ Tenho","fhave"],["missing","✗ Faltam","fmiss"]].map(([f,label,cls])=>{
            const cnt=f==="all"?cards.length:f==="have"?Object.keys(owned).length:cards.length-Object.keys(owned).length;
            return h("button",{key:f,className:"fbtn"+(filter===f?" "+cls:""),onClick:()=>setFilter(f)},label+" ("+cnt+")");
          }),
          h("input",{className:"search",value:cq,onChange:e=>setCq(e.target.value),
            placeholder:"Buscar carta (PT ou EN)...",style:{flex:1,minWidth:120,padding:"7px 11px"}})
        ),
        div({className:"hscroll",style:{marginBottom:13,alignItems:"center"}},
          h("span",{style:{fontSize:11,color:"var(--muted)",paddingRight:4,flexShrink:0}},"Ordenar:"),
          ...SORTS.map(s=>h("button",{key:s.id,className:"sbtn"+(sortBy===s.id?" on":""),onClick:()=>setSortBy(s.id)},s.label)),
          div({style:{marginLeft:"auto",flexShrink:0,display:"flex",alignItems:"center",gap:6}},
            h("span",{style:{fontSize:11,color:"var(--muted)",whiteSpace:"nowrap"}},"Tamanho:"),
            div({className:"szbtns"},
              ...SIZES.map(sz=>h("button",{key:sz.id,className:"szbtn"+(cardSize===sz.id?" on":""),onClick:()=>setCardSize(sz.id)},sz.label))
            )
          )
        ),
        cLoading
          ?div({className:"empty"},h("span",{className:"spin",style:{fontSize:24,display:"block",marginBottom:10}},"◌"),"Carregando cartas...")
          :vCards.length===0
            ?div({className:"empty"},"Nenhuma carta encontrada.")
            :div({className:"cardgrid",style:{gridTemplateColumns:"repeat(auto-fill,minmax("+SIZES.find(s=>s.id===cardSize).min+"px,1fr))"}},
              ...vCards.map(card=>{
                const isOwned=!!owned[card.id];const q=owned[card.id];
                const brl=fmtBRL(price(card),rate);
                const liga=ligaCardUrl(card,sel);
                const ptName=ptCardNames[card.number];
                return div({key:card.id,className:"ctile"+(isOwned?" owned":""),
                  onClick:()=>toggleCard(card.id),
                  title:(ptName?ptName+" / ":"")+card.name+(q?" ["+q+"]":"")
                },
                  card.images&&card.images.small
                    ?h("img",{src:card.images.small,alt:ptName||card.name,loading:"lazy"})
                    :div({style:{aspectRatio:"2.5/3.5",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,color:"var(--faint)",padding:4,textAlign:"center"}},ptName||card.name),
                  isOwned&&h("span",{className:"qbadge",style:{background:QBG[q],color:QFG[q]},
                    title:"Qualidade: "+QLabel[q]+" — toque para mudar",onClick:e=>cycleQ(e,card.id)},q),
                  div({className:"cbot"},
                    h("span",{className:"cnum"},"#"+card.number),
                    div({className:"cprice"},
                      brl?h("a",{href:liga,target:"_blank",rel:"noopener",onClick:e=>e.stopPropagation()},brl)
                         :h("a",{href:liga,target:"_blank",rel:"noopener",onClick:e=>e.stopPropagation(),style:{color:"var(--faint)"}},
                             h("span",null,"—"))
                    )
                  )
                );
              })
            )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
